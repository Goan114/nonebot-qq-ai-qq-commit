[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nonebot-feedback-suite"
version = "0.3.0"
description = "QQ game feedback triage and multi-repository GitHub commit monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nonebot2[fastapi,httpx]>=2.4,<3", "nonebot-adapter-onebot>=2.4,<3", "httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["feedback_hub", "nonebot_plugin_feedback_manager", "nonebot_plugin_commit_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
